
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile — Folio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/feed.css">
    <link rel="stylesheet" href="css/profile.css">
</head>

<body>

    <header class="navbar">
        <a href="/" class="logo">folio<span>.</span></a>

        <nav class="main-nav">
            <a href="/" class="nav-link">Home</a>
            <a href="/#feed" class="nav-link">Explore</a>
            <a href="discover.html" class="nav-link">Discover</a>
        </nav>

        <div class="nav-actions" id="navActions">
            <a href="login.html" class="login-button">Log in</a>
            <a href="register.html" class="signup-button">Join Folio</a>
        </div>
    </header>


    <main class="profile-page">

        <div class="profile-cover">
            <span>A LITTLE CORNER OF THE INTERNET</span>
        </div>


        <section class="profile-header">

            <div class="profile-avatar" id="profileAvatar">F</div>

            <div class="profile-information">

                <p class="eyebrow">COMMUNITY MEMBER</p>

                <h1 id="profileName">Loading profile...</h1>

                <p class="profile-username" id="profileUsername"></p>

                <p class="profile-bio" id="profileBio"></p>

                <p class="profile-joined" id="profileJoined"></p>

            </div>

            <div class="profile-actions" id="profileActions"></div>

        </section>


        <section class="profile-statistics">

            <div class="profile-stat">
                <strong id="profilePostsCount">0</strong>
                <span>Posts</span>
            </div>

            <button class="profile-stat" id="followersButton">
                <strong id="profileFollowersCount">0</strong>
                <span>Followers</span>
            </button>

            <button class="profile-stat" id="followingButton">
                <strong id="profileFollowingCount">0</strong>
                <span>Following</span>
            </button>

        </section>


        <section class="profile-posts-section">

            <div class="profile-section-heading">
                <div>
                    <p class="eyebrow">THEIR CORNER OF FOLIO</p>
                    <h2>Published stories<span>.</span></h2>
                </div>
            </div>

            <div class="profile-posts" id="profilePosts">
                <div class="feed-loading">Loading posts...</div>
            </div>

        </section>

    </main>


    <div class="modal-overlay" id="peopleModal" hidden>
        <div class="people-modal">

            <div class="modal-heading">
                <h2 id="peopleModalTitle">Community</h2>
                <button type="button" id="closePeopleModal">×</button>
            </div>

            <div id="peopleList" class="people-list"></div>

        </div>
    </div>


    <footer class="footer">
        <a href="/" class="logo">folio<span>.</span></a>
        <p>A little corner of the internet for everything.</p>
        <span>© 2026 Folio. Made for connection.</span>
    </footer>


    <script src="js/profile.js"></script>

</body>
</html>
