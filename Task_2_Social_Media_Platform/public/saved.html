
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your saved posts on Folio.">

    <title>Saved Posts — Folio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/feed.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/dashboard-extras.css">
    <link rel="stylesheet" href="css/saved.css">
</head>

<body class="dashboard-page saved-page">

    <header class="dashboard-topbar">
        <a href="/" class="logo">folio<span>.</span></a>

        <div class="topbar-center">
            <span class="topbar-edition">YOUR PERSONAL COLLECTION</span>
            <span class="topbar-date" id="currentDate"></span>
        </div>

        <div class="topbar-actions">
            <a href="/" class="topbar-create">← Back to feed</a>
        </div>
    </header>

    <main class="saved-page-container">

        <section class="saved-intro">
            <p class="eyebrow">YOUR FOLIO COLLECTION</p>

            <h1>Stories worth<br><em>keeping.</em></h1>

            <p>
                A collection of ideas, conversations and moments
                you want to come back to.
            </p>

            <div class="saved-stat">
                <span id="savedCount">0</span>
                <span>saved stories</span>
            </div>
        </section>

        <section class="saved-content">

            <div class="saved-heading">
                <div>
                    <p class="eyebrow">BOOKMARKS</p>
                    <h2>Your saved posts<span>.</span></h2>
                </div>

                <a href="/" class="saved-back-link">Explore the feed ↗</a>
            </div>

            <div id="savedPostsContainer" class="saved-posts-container">
                <div class="feed-loading">Loading your collection...</div>
            </div>

        </section>

    </main>

    <script src="js/saved.js"></script>

</body>
</html>
